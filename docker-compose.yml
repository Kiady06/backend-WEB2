services:
  postgres:
    image: postgres:16-alpine
    container_name: examhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - examhub_pg_data:/var/lib/postgresql/data

volumes:
  examhub_pg_data: